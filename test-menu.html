<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Menú Móvil - SecurityShield</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0e27;
            color: white;
        }

        /* NAVBAR CON Z-INDEX CORREGIDOS */
        .navbar {
            background-color: #060920;
            padding: 1rem 0;
            border-bottom: 2px solid #00d9ff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d9ff;
            z-index: 1002;
            position: relative;
        }

        /* MENÚ DESKTOP */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
            z-index: 1001;
        }

        .nav-menu a {
            color: #a0aec0;
            text-decoration: none;
            padding: 0.5rem 1rem;
        }

        /* BOTÓN HAMBURGUESA */
        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 25px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1002;
            position: relative;
        }

        .mobile-menu-toggle span {
            width: 100%;
            height: 3px;
            background-color: #00d9ff;
            border-radius: 3px;
            transition: all 0.3s ease;
            display: block;
        }

        /* OVERLAY */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: flex !important;
            }

            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: #060920;
                flex-direction: column;
                justify-content: flex-start;
                align-items: stretch;
                padding: 80px 0 20px;
                gap: 0;
                transition: right 0.3s ease;
                box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
                overflow-y: auto;
                z-index: 1001;
            }

            .nav-menu.active {
                right: 0 !important;
            }

            .nav-menu li {
                width: 100%;
                margin: 0;
            }

            .nav-menu a {
                display: block;
                width: 100%;
                padding: 1rem 2rem;
                border-bottom: 1px solid rgba(0, 217, 255, 0.1);
            }

            .mobile-menu-toggle.active span:nth-child(1) {
                transform: rotate(45deg) translate(8px, 8px);
            }

            .mobile-menu-toggle.active span:nth-child(2) {
                opacity: 0;
            }

            .mobile-menu-toggle.active span:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -7px);
            }
        }

        /* CONTENIDO DE PRUEBA */
        .test-content {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .test-section {
            background: #131940;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 10px;
            border: 1px solid #00d9ff;
        }

        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            margin: 0.5rem 0;
            font-weight: bold;
        }

        .status.success {
            background: #10b981;
        }

        .status.error {
            background: #ef4444;
        }

        #log {
            background: #000;
            padding: 1rem;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .log-entry {
            margin: 0.25rem 0;
            padding: 0.25rem;
        }

        .log-info { color: #00d9ff; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-warning { color: #f59e0b; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">SecurityShield TEST</div>
            
            <button class="mobile-menu-toggle" id="menuToggle" aria-label="Menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Planes</a></li>
                <li><a href="#">Contacto</a></li>
                <li><a href="#">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="nav-overlay" id="navOverlay"></div>

    <div class="test-content">
        <h1>🔍 Diagnóstico del Menú Móvil</h1>
        
        <div class="test-section">
            <h2>Estado de Elementos</h2>
            <div id="elementStatus"></div>
        </div>

        <div class="test-section">
            <h2>Ancho de Pantalla</h2>
            <div id="screenWidth"></div>
        </div>

        <div class="test-section">
            <h2>Log de Eventos</h2>
            <div id="log"></div>
        </div>

        <div class="test-section">
            <h2>Prueba Manual</h2>
            <button onclick="testToggle()" style="padding: 1rem 2rem; background: #00d9ff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Abrir/Cerrar Menú Manualmente
            </button>
        </div>
    </div>

    <script>
        // Sistema de logging
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // Verificar elementos al cargar
        function checkElements() {
            const menuToggle = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            const status = document.getElementById('elementStatus');
            let html = '';
            
            if (menuToggle) {
                html += '<div class="status success">✅ Botón hamburguesa encontrado</div>';
                log('Botón hamburguesa encontrado', 'success');
            } else {
                html += '<div class="status error">❌ Botón hamburguesa NO encontrado</div>';
                log('Botón hamburguesa NO encontrado', 'error');
            }
            
            if (navMenu) {
                html += '<div class="status success">✅ Menú encontrado</div>';
                log('Menú encontrado', 'success');
            } else {
                html += '<div class="status error">❌ Menú NO encontrado</div>';
                log('Menú NO encontrado', 'error');
            }
            
            if (navOverlay) {
                html += '<div class="status success">✅ Overlay encontrado</div>';
                log('Overlay encontrado', 'success');
            } else {
                html += '<div class="status error">❌ Overlay NO encontrado</div>';
                log('Overlay NO encontrado', 'error');
            }
            
            status.innerHTML = html;
        }

        // Actualizar ancho de pantalla
        function updateScreenWidth() {
            const width = window.innerWidth;
            const screenDiv = document.getElementById('screenWidth');
            const isMobile = width <= 768;
            screenDiv.innerHTML = `
                <div>Ancho actual: <strong>${width}px</strong></div>
                <div class="status ${isMobile ? 'success' : 'error'}">
                    ${isMobile ? '📱 Modo MÓVIL activo' : '🖥️ Modo DESKTOP activo'}
                </div>
            `;
        }

        // Función de toggle manual
        function testToggle() {
            const menuToggle = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            log('Ejecutando toggle manual...', 'info');
            
            const isActive = navMenu.classList.contains('active');
            
            if (isActive) {
                log('Cerrando menú...', 'warning');
                menuToggle.classList.remove('active');
                navMenu.classList.remove('active');
                navOverlay.classList.remove('active');
            } else {
                log('Abriendo menú...', 'success');
                menuToggle.classList.add('active');
                navMenu.classList.add('active');
                navOverlay.classList.add('active');
            }
            
            log(`Menú ahora está: ${!isActive ? 'ABIERTO' : 'CERRADO'}`, 'info');
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            log('Página cargada', 'success');
            checkElements();
            updateScreenWidth();
            
            const menuToggle = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            const navOverlay = document.getElementById('navOverlay');
            
            if (!menuToggle || !navMenu || !navOverlay) {
                log('CRÍTICO: Faltan elementos necesarios', 'error');
                return;
            }
            
            // Event listener para el botón
            menuToggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                log('¡CLIC EN HAMBURGUESA DETECTADO!', 'success');
                testToggle();
            });
            
            // Event listener para el overlay
            navOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                log('Clic en overlay detectado', 'info');
                testToggle();
            });
            
            // Event listeners para los enlaces
            const links = navMenu.querySelectorAll('a');
            links.forEach((link, index) => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    log(`Clic en enlace ${index + 1}: ${this.textContent}`, 'info');
                    if (window.innerWidth <= 768) {
                        setTimeout(() => testToggle(), 100);
                    }
                });
            });
            
            log('Event listeners registrados correctamente', 'success');
        });

        // Actualizar ancho al redimensionar
        window.addEventListener('resize', updateScreenWidth);
    </script>
</body>
</html>
