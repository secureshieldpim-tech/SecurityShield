<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando... - SecurityShield</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.png">
    <style>
        .callback-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 217, 255, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .callback-message {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .callback-submessage {
            color: var(--text-gray);
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner"></div>
        <h1 class="callback-message">Procesando inicio de sesión...</h1>
        <p class="callback-submessage">Serás redirigido en un momento</p>
    </div>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script src="auth-config.js"></script>
    <script>
        async function handleCallback() {
            try {
                const auth0Client = await auth0.createAuth0Client({
                    domain: AUTH0_CONFIG.domain,
                    clientId: AUTH0_CONFIG.clientId,
                    authorizationParams: {
                        redirect_uri: AUTH0_CONFIG.authorizationParams.redirect_uri
                    },
                    cacheLocation: 'localstorage'
                });

                await auth0Client.handleRedirectCallback();
                const user = await auth0Client.getUser();

                const userData = {
                    email: user.email,
                    nombre: user.name || user.email.split('@')[0],
                    id: user.sub,
                    picture: user.picture
                };
                localStorage.setItem('secureshield_user', JSON.stringify(userData));

                const selectedPlan = sessionStorage.getItem('selected_plan');
                
                if (selectedPlan) {
                    sessionStorage.removeItem('selected_plan');
                    window.location.href = 'confirmacion.html?plan=' + selectedPlan;
                } else {
                    window.location.href = 'login.html';
                }

            } catch (error) {
                console.error(error);
                alert('Error al procesar inicio de sesión.');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        }

        handleCallback();
    </script>
</body>
</html>
